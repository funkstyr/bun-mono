name: Deploy static app

on:
  push:
    branches: [main]
    paths:
      - "apps/static/**"
      - "packages/core-ui/**"
      - "packages/tic-tac-toe/**"
      - "packages/royalty/**"
      - "packages/workout-timer/**"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-static-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-static-${{ runner.os }}-

      - name: Build static app
        run: bunx turbo run build --filter=static...

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/static/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
