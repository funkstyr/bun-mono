# Docker Compose for bun-mono
# Full-stack container orchestration

name: bun-mono

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: bun-mono-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://server:3001
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - bun-mono-network

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: bun-mono-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - bun-mono-network

networks:
  bun-mono-network:
    driver: bridge

volumes:
